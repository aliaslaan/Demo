  <style>
    /* Logo Slider Animasyonu */
    @keyframes scrollLogos {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .logo-slider-track {
      display: flex;
      width: calc(200px * 10);
      animation: scrollLogos 20s linear infinite;
    }
    .logo-slider-track:hover {
      animation-play-state: paused;
    }
    .logo-item {
      flex: 0 0 auto;
      width: 160px;
      margin: 0 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: grayscale(20%);
      transition: filter 0.3s;
    }
    .logo-item:hover {
      filter: grayscale(0%);
    }
    .logo-item img {
      max-width: 100%;
      height: 70px;
      object-fit: contain;
    }
    @media (max-width: 640px) {
      .logo-item { width: 120px; margin: 0 15px; }
      .logo-item img { height: 50px; }
    }
  </style>
</head>
