<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 'mont': ['Montserrat', 'sans-serif'] },
          colors: {
            'dark-bg': '#121212',
            'neon-blue': '#00d2ff',

        }
      }

  <style>

    @keyframes glow-pulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255,100,0,0.6)) drop-shadow(0 0 20px rgba(0,210,255,0.4)); }
      50% { filter: drop-shadow(0 0 18px rgba(255,100,0,0.9)) drop-shadow(0 0 40px rgba(0,210,255,0.7)); }

    .logo-glow { animation: glow-pulse 2.5s ease-in-out infinite; }
